[package]
name = "predator-hunters-db"
version = "0.1.0"
edition = "2021"

[dependencies]
# Dioxus framework
dioxus = "0.7"
dioxus-web = "0.7"
dioxus-router = "0.7"
dioxus-signals = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json"] }
gloo-net = { version = "0.6", features = ["http", "json"] }

# Web utilities
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Storage",
    "Notification",
    "NotificationPermission",
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
] }

# Logging
log = "0.4"
console_log = "1.0"

# Timers and utilities
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
uuid = { version = "1.0", features = ["v4", "js"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
