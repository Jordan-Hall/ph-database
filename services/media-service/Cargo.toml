[package]
name = "media-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "limit"] }

# SurrealDB client
surrealdb = { version = "2.0", features = ["protocol-ws"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Environment & Config
dotenvy = "0.15"
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# File operations
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1.0"

# MinIO/S3 client
aws-sdk-s3 = "1.0"
aws-config = "1.0"

# Video processing (FFmpeg wrapper)
tokio-process = "0.2"

# MIME type detection
mime_guess = "2.0"

# Async streams
async-stream = "0.3"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
